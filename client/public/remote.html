<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>aerodance remote</title>
<meta name="theme-color" content="#5ec8f2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="aerodance" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  :root {
    --sky-top: #3fb6f0; --sky-bottom: #e8fbff; --grass: #7fd858;
    --ink: #0b3d6b; --ink-soft: #3d6a8f; --glass: rgba(255,255,255,.55); --glass-edge: rgba(255,255,255,.9);
    --aqua: #13a8e8; --aqua-deep: #0a78c2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    font: 16px/1.4 -apple-system, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, #8fdcfb 45%, var(--sky-bottom) 72%, #c9f29a 72.2%, var(--grass) 100%) fixed;
    -webkit-user-select: none; user-select: none;
    position: fixed; inset: 0; overflow: hidden; touch-action: none;
  }
  main { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px); }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.78), var(--glass));
    border: 1px solid var(--glass-edge); border-radius: 22px; padding: 18px;
    box-shadow: 0 10px 30px rgba(11,61,107,.18), inset 0 1px 0 #fff;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); margin-bottom: 14px;
  }
  h2 { margin: 0 0 10px; font-size: 19px; }
  .btn {
    position: relative; overflow: hidden; display: block; width: 100%; margin-top: 16px; padding: 14px 16px;
    font: inherit; font-size: 18px; font-weight: 800; color: #fff; border: 1px solid var(--aqua-deep); border-radius: 999px;
    background: linear-gradient(180deg, #7fdcff 0%, var(--aqua) 50%, var(--aqua-deep) 100%);
    box-shadow: 0 6px 16px rgba(10,120,194,.35), inset 0 1px 0 rgba(255,255,255,.7); text-shadow: 0 1px 1px rgba(0,0,0,.25);
    text-align: center; text-decoration: none;
  }
  .btn::before { content: ""; position: absolute; left: 6%; right: 6%; top: 2px; height: 46%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.1)); }
  .btn:active { transform: scale(.97); }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%) translateY(140%);
    background: rgba(11,61,107,.92); color: #fff; padding: 12px 18px; border-radius: 16px; font-weight: 700; max-width: 92vw; text-align: center;
    transition: transform .3s ease, visibility .3s; z-index: 10; visibility: hidden; }
  .toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
  /* While you hold it, the page is one full-screen white Wii remote. */
  .wii {
    position: fixed; z-index: 2;
    inset: calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px);
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 24px 14px;
    border-radius: 56px; color: #8a98a5; font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    background: linear-gradient(90deg, #dfe5ea 0%, #f8fafb 12%, #ffffff 40%, #ffffff 60%, #f6f8fa 88%, #dbe2e8 100%);
    box-shadow: 0 20px 50px rgba(11,61,107,.35), inset 0 2px 0 #fff, inset 0 -4px 10px rgba(11,61,107,.1);
  }
  .wii button { touch-action: none; font-family: inherit; -webkit-touch-callout: none; }
  .wii-top { display: flex; align-items: center; gap: 14px; width: 100%; }
  .power { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; position: relative;
    background: radial-gradient(circle at 40% 30%, #ffffff, #dfe6ec 70%, #c8d3dc); box-shadow: 0 3px 8px rgba(11,61,107,.25); }
  .power::before { content: ""; position: absolute; inset: 11px; border: 2.5px solid #d9534f; border-top-color: transparent; border-radius: 50%; }
  .power::after { content: ""; position: absolute; left: 50%; top: 8px; width: 2.5px; height: 11px; margin-left: -1.25px; background: #d9534f; border-radius: 2px; }
  .modes { flex: 1; display: flex; padding: 3px; border-radius: 999px; background: #e6ecf0; box-shadow: inset 0 2px 5px rgba(11,61,107,.15); }
  .modes button { flex: 1; border: 0; padding: 8px 6px; border-radius: 999px; background: none; font-size: 13px; font-weight: 800; letter-spacing: .04em; color: #8a98a5; }
  .modes button.on { color: #fff; background: linear-gradient(180deg, #8fdcff, #1f9be0); box-shadow: 0 2px 6px rgba(10,120,194,.35); }
  .pad { width: 100%; flex: 1; min-height: 110px; border-radius: 30px; display: grid; place-items: center; text-align: center; padding: 14px;
    font-size: 13px; font-weight: 700; letter-spacing: .02em; color: #9aa8b4;
    background: radial-gradient(circle at 50% 30%, #fbfdfe, #e7eef3); box-shadow: inset 0 3px 10px rgba(11,61,107,.14); }
  .pad.live { color: #1f9be0; }
  .pad.touch { background: radial-gradient(circle at 50% 30%, #ffffff, #edf2f6); box-shadow: inset 0 0 0 2px #d6e0e8, inset 0 3px 10px rgba(11,61,107,.1); }
  .wii .a { flex: none; width: 104px; height: 104px; border-radius: 50%; border: 0; font-size: 46px; font-weight: 800; color: #8a98a5;
    background: radial-gradient(circle at 40% 30%, #ffffff, #e4eaef 70%, #cad5de); box-shadow: 0 8px 18px rgba(11,61,107,.25), inset 0 -4px 8px rgba(11,61,107,.12); }
  .wii .b { flex: none; width: 66px; height: 66px; border-radius: 50%; border: 0; font-size: 24px; font-weight: 800; color: #8a98a5;
    background: radial-gradient(circle at 40% 30%, #ffffff, #e4eaef 70%, #cad5de); box-shadow: 0 5px 12px rgba(11,61,107,.22); }
  .wii-row { display: flex; align-items: center; justify-content: center; gap: 22px; }
  .pm { width: 44px; height: 44px; border-radius: 50%; border: 0; font-size: 26px; font-weight: 700; line-height: 1; color: #8a98a5;
    background: linear-gradient(180deg, #ffffff, #e4eaef); box-shadow: 0 3px 8px rgba(11,61,107,.2); }
  .home { height: 44px; padding: 0 16px; border-radius: 999px; border: 0; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #1f9be0;
    background: linear-gradient(180deg, #ffffff, #e4eaef); box-shadow: 0 3px 8px rgba(11,61,107,.2); }
  .leds { display: flex; gap: 16px; margin-bottom: -4px; }
  .leds span { width: 9px; height: 9px; border-radius: 2px; background: #cdd6dd; box-shadow: inset 0 1px 1px rgba(0,0,0,.15); }
  .leds span.on { background: #34b9ff; box-shadow: 0 0 10px #34b9ff, 0 0 3px #9fe0ff; }
  .wii-brand { font-size: 17px; font-weight: 300; letter-spacing: .2em; color: #b8c3cc; }
  .wii-foot { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 11px; font-weight: 600; color: #a7b3bd; }
  .wii-foot button { border: 0; background: none; padding: 4px 0; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: #8a98a5; text-transform: uppercase; }
  .wii .down { transform: scale(.93); box-shadow: 0 2px 6px rgba(11,61,107,.25), inset 0 3px 8px rgba(11,61,107,.2); }
  .tune-sheet { position: fixed; z-index: 3; left: 14px; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 10px); padding: 18px 20px 16px;
    border-radius: 32px; background: #ffffff; color: #5d6e7c; font-size: 14px; box-shadow: 0 -10px 40px rgba(11,61,107,.3); }
  .tune-sheet h3 { margin: 0 0 6px; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #8a98a5; }
  .tune-sheet label { display: block; margin-top: 12px; }
  .tune-sheet input[type=range] { width: 100%; padding: 0; margin-top: 6px; accent-color: #1f9be0; }
  .tune-sheet .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .tune-sheet .opts button { flex: 1 1 40%; border: 0; padding: 11px 8px; border-radius: 999px; font: 700 13px -apple-system, system-ui, sans-serif; color: #5d6e7c;
    background: linear-gradient(180deg, #ffffff, #e4eaef); box-shadow: 0 3px 8px rgba(11,61,107,.18); touch-action: none; }
  .tune-sheet .opts button.on { color: #fff; background: linear-gradient(180deg, #8fdcff, #1f9be0); }
  .tune-sheet .done { display: block; width: 100%; margin-top: 14px; border: 0; padding: 12px; border-radius: 999px; font: 800 15px -apple-system, system-ui, sans-serif;
    color: #fff; background: linear-gradient(180deg, #8fdcff, #1f9be0); touch-action: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <section class="hidden" id="remoteCard">
    <div class="wii">
      <div class="leds" aria-label="Player 1"><span class="on"></span><span></span><span></span><span></span></div>
      <div class="wii-top">
        <button class="power" id="remoteRelease" type="button" aria-label="Hand off the remote"></button>
        <div class="modes">
          <button id="modeRemote" type="button">POINT</button>
          <button id="modeTouch" type="button">TOUCHPAD</button>
        </div>
      </div>
      <div class="pad" id="pad"></div>
      <button class="a" id="remoteA" type="button">A</button>
      <button class="b" id="remoteB" type="button" aria-label="Back">B</button>
      <div class="wii-row">
        <button class="pm" id="speedDown" type="button" aria-label="Slower pointer">&minus;</button>
        <button class="home" id="remoteCenter" type="button" aria-label="Center the cursor">HOME</button>
        <button class="pm" id="speedUp" type="button" aria-label="Faster pointer">+</button>
      </div>
      <div class="wii-brand">aerodance</div>
      <div class="wii-foot">
        <span id="remoteStatus"></span>
        <button id="tuneOpen" type="button">Settings</button>
      </div>
    </div>
    <div class="tune-sheet hidden" id="tuneSheet">
      <h3>Pointer settings</h3>
      <label>Speed <b id="tuneSpeedVal"></b><input type="range" id="tuneSpeed" min="0.3" max="3" step="0.1" /></label>
      <label>Steadiness <b id="tuneDeadVal"></b><input type="range" id="tuneDead" min="0" max="10" step="0.5" /></label>
      <div class="opts">
        <button id="tuneFlipX" type="button">Flip left / right</button>
        <button id="tuneFlipY" type="button">Flip up / down</button>
        <button id="tuneSwap" type="button">Swap axes</button>
        <button id="tuneReset" type="button">Reset</button>
      </div>
      <button class="done" id="tuneDone" type="button">Done</button>
    </div>
  </section>

  <section class="card hidden" id="remoteTaken">
    <h2>The remote is taken</h2>
    <p style="margin:0"><b id="remoteHolder"></b> already has the remote for this screen.</p>
    <button class="btn" id="remoteRetry" type="button">Try again</button>
    <a class="btn" href="/join">Back to aerodance</a>
  </section>

  <section class="card hidden" id="remoteOff">
    <h2 id="remoteOffTitle">That screen turned off</h2>
    <p style="margin:0">Scan the QR code on the aerodance screen again to grab the remote.</p>
    <a class="btn" href="/join">Back to aerodance</a>
  </section>
</main>
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  // /remote.html?code=CODE: the phone remote for one menu screen. /join?remote=CODE sends
  // phones here once they have a profile (the app's device token, see client/src/battle/api.js).
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const remoteCode = (new URLSearchParams(location.search).get("code") || "").toUpperCase() || null;
  const device = store.get("aerodance.device");
  if (!remoteCode) return location.replace("/join");
  if (!device) return location.replace(`/join?remote=${encodeURIComponent(remoteCode)}`);

  function toast(text, ms = 2600) {
    const t = $("toast"); t.textContent = text; t.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), ms);
  }
  const show = (id, on) => $(id).classList.toggle("hidden", !on);

  // Motion comes from the gyroscope (Wii-style pointing) or from dragging on the pad.
  const GYRO_GAIN = 42;   // menu design units (1600 wide) per degree turned, at speed 1
  const TOUCH_GAIN = 2.6; // per CSS pixel dragged, at speed 1

  // Per-phone tuning, saved on this device: speed, deadzone (deg/s a still hand may
  // wobble without moving the cursor), axis flips and swap.
  const TUNE_DEFAULT = { speed: 1, dead: 2.5, flipX: false, flipY: false, swap: false };
  let tune = { ...TUNE_DEFAULT, ...(store.get("aerodance.remoteTune") || {}) };
  function renderTune() {
    $("tuneSpeed").value = tune.speed; $("tuneSpeedVal").textContent = `${tune.speed.toFixed(1)}x`;
    $("tuneDead").value = tune.dead; $("tuneDeadVal").textContent = `${tune.dead}°/s`;
    $("tuneFlipX").classList.toggle("on", tune.flipX);
    $("tuneFlipY").classList.toggle("on", tune.flipY);
    $("tuneSwap").classList.toggle("on", tune.swap);
    store.set("aerodance.remoteTune", tune);
  }
  $("tuneSpeed").oninput = () => { tune.speed = Number($("tuneSpeed").value); renderTune(); };
  $("tuneDead").oninput = () => { tune.dead = Number($("tuneDead").value); renderTune(); };
  for (const k of ["FlipX", "FlipY", "Swap"]) {
    const key = k[0].toLowerCase() + k.slice(1);
    $("tune" + k).onclick = () => { tune[key] = !tune[key]; renderTune(); };
  }
  $("tuneReset").onclick = () => { tune = { ...TUNE_DEFAULT }; renderTune(); };
  renderTune();

  let holding = false, pending = { dx: 0, dy: 0 };
  const rsock = io();
  rsock.on("connect", claimRemote); // also re-claims after a reconnect
  rsock.on("disconnect", () => { if (holding) $("remoteStatus").textContent = "Reconnecting…"; });
  rsock.on("remote:ended", ({ reason }) => {
    holding = false;
    show("remoteCard", false);
    $("remoteOffTitle").textContent = reason === "moved" ? "The remote moved to your other device" : "That screen turned off";
    show("remoteOff", true);
  });

  function claimRemote() {
    rsock.emit("remote:claim", { code: remoteCode, deviceToken: device }, (r) => {
      holding = !!r?.ok;
      show("remoteCard", holding);
      show("remoteTaken", r?.reason === "taken");
      show("remoteOff", r?.reason === "gone");
      if (holding) { $("remoteStatus").textContent = `Screen ${remoteCode}`; keepAwake(); }
      else if (r?.reason === "taken") $("remoteHolder").textContent = r.holder || "Someone";
      // The device token no longer matches a profile: make one again, then come back.
      else if (r?.reason === "profile") { store.set("aerodance.device", null); location.replace(`/join?remote=${encodeURIComponent(remoteCode)}`); }
    });
  }
  $("remoteRetry").onclick = claimRemote;
  $("remoteRelease").onclick = () => {
    rsock.emit("remote:release");
    holding = false;
    window.removeEventListener("devicemotion", onMotion);
    motionOn = false;
    location.replace("/join");
  };

  // Gyro pointing. Yaw is the spin around the world's vertical axis, so it works held
  // flat like a Wii remote or upright; pitch is tilting the top edge up and down.
  let motionOn = false, upVec = null, lastMotion = 0;
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  function onMotion(e) {
    const g = e.accelerationIncludingGravity, r = e.rotationRate;
    if (!g || !r || g.x == null || r.alpha == null) return;
    // Rotation rate around the phone's own x / y / z axes. Safari on iOS reports
    // alpha/beta/gamma as x/y/z; the spec (and Android) uses alpha=z, beta=x, gamma=y.
    const rx = iOS ? r.alpha : r.beta, ry = iOS ? r.beta : r.gamma, rz = iOS ? r.gamma : r.alpha;
    const sgn = iOS ? -1 : 1; // iOS reports gravity with the opposite sign to Android
    const gx = g.x * sgn, gy = g.y * sgn, gz = g.z * sgn;
    upVec = upVec ? { x: upVec.x * 0.9 + gx * 0.1, y: upVec.y * 0.9 + gy * 0.1, z: upVec.z * 0.9 + gz * 0.1 } : { x: gx, y: gy, z: gz };
    const now = performance.now();
    const dt = lastMotion ? Math.min((now - lastMotion) / 1000, 0.1) : 0;
    lastMotion = now;
    if (!dt) return;
    const len = Math.hypot(upVec.x, upVec.y, upVec.z) || 1;
    let yaw = (rx * upVec.x + ry * upVec.y + rz * upVec.z) / len;
    let pitch = rx;
    if (tune.swap) [yaw, pitch] = [pitch, yaw];
    const k = dt * GYRO_GAIN * tune.speed;
    if (Math.abs(yaw) > tune.dead) pending.dx -= yaw * k * (tune.flipX ? -1 : 1);
    if (Math.abs(pitch) > tune.dead) pending.dy -= pitch * k * (tune.flipY ? -1 : 1);
  }
  // Two exclusive modes: "remote" points with the gyroscope, "touch" drags on the pad.
  let mode = store.get("aerodance.remoteMode") === "touch" ? "touch" : "remote";
  async function setMode(next) {
    window.removeEventListener("devicemotion", onMotion);
    motionOn = false;
    if (next === "remote") {
      try {
        if (typeof DeviceMotionEvent === "undefined") throw new Error("unsupported");
        // iOS only grants motion from inside a tap, so this runs from the mode buttons.
        if (typeof DeviceMotionEvent.requestPermission === "function" && (await DeviceMotionEvent.requestPermission()) !== "granted") throw new Error("denied");
        window.addEventListener("devicemotion", onMotion);
        motionOn = true;
        lastMotion = 0;
        upVec = null;
      } catch {
        toast("Motion isn't available here. Using the touchpad");
        next = "touch";
      }
    }
    mode = next;
    store.set("aerodance.remoteMode", mode);
    renderMode();
  }
  function renderMode() {
    $("modeRemote").classList.toggle("on", mode === "remote");
    $("modeTouch").classList.toggle("on", mode === "touch");
    $("pad").classList.toggle("live", mode === "remote" && motionOn);
    $("pad").classList.toggle("touch", mode === "touch");
    $("pad").textContent = mode === "touch"
      ? "Drag here to move the cursor"
      : motionOn ? "Point at the screen" : "Tap POINT to start pointing";
  }
  $("modeRemote").onclick = () => setMode("remote");
  $("modeTouch").onclick = () => setMode("touch");
  renderMode();

  let padDrag = null;
  $("pad").addEventListener("pointerdown", (e) => {
    if (mode !== "touch") return;
    padDrag = { x: e.clientX, y: e.clientY };
    $("pad").setPointerCapture(e.pointerId);
  });
  $("pad").addEventListener("pointermove", (e) => {
    if (!padDrag) return;
    pending.dx += (e.clientX - padDrag.x) * TOUCH_GAIN * tune.speed;
    pending.dy += (e.clientY - padDrag.y) * TOUCH_GAIN * tune.speed;
    padDrag = { x: e.clientX, y: e.clientY };
  });
  for (const t of ["pointerup", "pointercancel"]) $("pad").addEventListener(t, () => { padDrag = null; });

  // A short click on every remote button. Android: the vibrate API on press. iOS Safari
  // has no vibrate, but toggling a native switch plays the system haptic, and only a real
  // tap counts. So, like tijnjh/ios-haptics, each button gets a transparent label on top,
  // wired to a hidden switch: the finger's own tap toggles it (on release).
  const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  function hapticTrigger(el) {
    if (el.querySelector(":scope > [data-haptic]")) return;
    const label = document.createElement("label");
    label.setAttribute("data-haptic", "");
    label.setAttribute("aria-hidden", "true");
    Object.assign(label.style, { position: "absolute", inset: "0", touchAction: "manipulation", borderRadius: "inherit" });
    label.style.setProperty("-webkit-tap-highlight-color", "transparent");
    const sw = document.createElement("input");
    sw.type = "checkbox";
    sw.setAttribute("switch", "");
    Object.assign(sw.style, { position: "absolute", width: "1px", height: "1px", margin: "0", visibility: "hidden" });
    // The label re-dispatches its click to the switch; don't let that copy reach the button too.
    sw.addEventListener("click", (e) => e.stopPropagation());
    label.append(sw);
    if (getComputedStyle(el).position === "static") el.style.position = "relative";
    el.append(label);
  }
  if (isIos) document.querySelectorAll("#remoteCard button").forEach(hapticTrigger);
  else if (navigator.vibrate) $("remoteCard").addEventListener("pointerdown", (e) => { if (e.target.closest("button")) navigator.vibrate(12); });

  // Settings sheet, and − / + as quick speed steps.
  $("tuneOpen").onclick = () => show("tuneSheet", true);
  $("tuneDone").onclick = () => show("tuneSheet", false);
  const stepSpeed = (d) => {
    tune.speed = Math.round(Math.min(3, Math.max(0.3, tune.speed + d)) * 10) / 10;
    renderTune();
    toast(`Pointer speed ${tune.speed.toFixed(1)}x`, 1200);
  };
  $("speedDown").onclick = () => stepSpeed(-0.1);
  $("speedUp").onclick = () => stepSpeed(0.1);

  function remoteButton(el, name) {
    let down = false;
    const press = (pressed) => {
      el.classList.toggle("down", pressed);
      if (holding) rsock.emit("remote:button", { button: name, pressed });
    };
    // No preventDefault here: on iOS it would stop the tap's click, and the haptic with it.
    el.addEventListener("pointerdown", () => { down = true; press(true); });
    for (const t of ["pointerup", "pointercancel", "pointerleave"]) el.addEventListener(t, () => { if (down) { down = false; press(false); } });
  }
  remoteButton($("remoteA"), "a");
  remoteButton($("remoteB"), "b");
  remoteButton($("remoteCenter"), "center");

  // At most one move per frame; volatile so a slow network drops stale moves.
  function sendMoves() {
    if (holding && (pending.dx || pending.dy)) {
      rsock.volatile.emit("remote:move", { dx: Math.round(pending.dx * 10) / 10, dy: Math.round(pending.dy * 10) / 10 });
    }
    pending = { dx: 0, dy: 0 };
    requestAnimationFrame(sendMoves);
  }
  requestAnimationFrame(sendMoves);

  let wakeLock = null;
  async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && holding && (!wakeLock || wakeLock.released)) keepAwake(); });
})();
</script>
</body>
