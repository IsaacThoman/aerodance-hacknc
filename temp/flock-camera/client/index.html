<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171c20" />
    <title>Flock Falcon — 3D reference model</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <canvas aria-label="Interactive 3D model of a Flock camera on a pole"></canvas>
      <header>
        <p class="eyebrow">PHOTO RECONSTRUCTION / 01</p>
        <h1>Flock Falcon</h1>
        <p class="subtitle">Solar camera & pole assembly</p>
      </header>
      <nav aria-label="Model viewpoints">
        <button data-view="detail" aria-pressed="true">Assembly detail</button>
        <button data-view="full" aria-pressed="false">Full pole</button>
        <button data-view="optics" aria-pressed="false">Optics</button>
        <button data-view="front" aria-pressed="false">Body front</button>
        <button data-view="side" aria-pressed="false">Body profile</button>
        <button data-view="rear" aria-pressed="false">Rear hardware</button>
        <button data-view="solar" aria-pressed="false">Solar surface</button>
      </nav>
      <aside>
        <p class="eyebrow">MODEL INSPECTION</p>
        <label class="detail-level" for="detail-level">Model detail</label>
        <select id="detail-level">
          <option value="high">High detail</option>
          <option value="low">Low poly</option>
          <option value="world">World LOD</option>
        </select>
        <label><input type="checkbox" id="wireframe" /> Wireframe</label>
        <label><input type="checkbox" id="rotate" /> Auto rotate</label>
        <div class="rule"></div>
        <label><input type="checkbox" data-part="Solar assembly" checked /> Solar assembly</label>
        <label><input type="checkbox" data-part="Battery pack" checked /> Battery packs</label>
        <label><input type="checkbox" data-part="open-bottom" checked /> Camera hood</label>
        <div class="rule"></div>
        <a id="download-model" href="/models/flock-camera.glb?v=down-7" download>Download GLB <span>↗</span></a>
      </aside>
      <footer><p>Drag to orbit · Scroll to zoom · Right-drag to pan</p><p id="stats">Loading geometry…</p></footer>
      <div id="loading" role="status">Loading model…</div>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
