name: Android

on:
  pull_request:
    paths:
      - client-android/**
      - .github/workflows/android.yml
  push:
    branches: [main]
    paths:
      - client-android/**
      - .github/workflows/android.yml

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          # gradle/gradle-daemon-jvm.properties pins an Azul JDK 21 for the Gradle daemon.
          distribution: zulu
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the retired "tools" package, which sdkmanager no longer finds.
          packages: platform-tools
      - name: Install NDK and CMake for the native libyuv build
        # Versions from gradle/libs.versions.toml (android-ndk, android-cmake).
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug
