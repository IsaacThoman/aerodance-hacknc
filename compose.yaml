services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aerodance}
      AGENT_URL: http://agent:4000
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      # Base for battle links the bot texts out, e.g. https://aerodance.tech
      PUBLIC_URL: ${PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aerodance}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Solana devnet + iMessage worker. Internal only: no domain, no published port.
  # The app reaches it at agent:4000; it reaches the app's internal API at app:3001.
  agent:
    build: ./agent
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aerodance}
      APP_URL: http://app:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      # Trophy NFT metadata URIs point here (the app serves /nft/<id>.json)
      PUBLIC_URL: ${PUBLIC_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_TREASURY_SECRET: ${SOLANA_TREASURY_SECRET:-}
      # Leave these unset (e.g. in PR previews) and the bot stays off; texts are only logged.
      PROJECT_ID: ${PROJECT_ID:-}
      PROJECT_SECRET: ${PROJECT_SECRET:-}
      PHOTON_TOKEN: ${PHOTON_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
