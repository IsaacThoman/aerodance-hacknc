services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aerodance}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aerodance}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent:
    build: ./agent
    expose:
      - "4000"
    environment:
      PORT: "4000"
      PROJECT_ID: ${PROJECT_ID:-}
      PROJECT_SECRET: ${PROJECT_SECRET:-}
      PHOTON_TOKEN: ${PHOTON_TOKEN:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      BATTLE_BASE_URL: ${BATTLE_BASE_URL:-http://localhost:3000}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - agent-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
  agent-data:
